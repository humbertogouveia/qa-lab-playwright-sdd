name: App CI

on:
  push:
    branches: [main, master]
    paths: ['qa-lab-app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['qa-lab-app/**', '.github/workflows/app-ci.yml']

defaults:
  run:
    working-directory: qa-lab-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-lab-app/package-lock.json

      - run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Subir o app e checar a saúde
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "O app não subiu a tempo" && exit 1
