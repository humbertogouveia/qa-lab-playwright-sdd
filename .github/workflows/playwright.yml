name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:3000
      # Credenciais vêm dos secrets do repositório (Settings > Secrets and variables > Actions)
      TEST_CLIENTE_EMAIL: ${{ secrets.TEST_CLIENTE_EMAIL }}
      TEST_CLIENTE_PASSWORD: ${{ secrets.TEST_CLIENTE_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa-lab-app/package-lock.json

      - name: Instalar dependências da automação
        run: npm ci

      - name: Instalar dependências do app
        run: npm ci --prefix qa-lab-app

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      # O app sobe automaticamente pelo bloco webServer do playwright.config.ts
      - name: Rodar os testes
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
