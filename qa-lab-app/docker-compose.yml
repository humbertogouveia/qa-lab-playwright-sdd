services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Exemplo: BUGS=wrongTotal,slowCatalog docker compose up
      BUGS: ${BUGS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
